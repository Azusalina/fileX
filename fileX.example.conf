# fileX v1.5 — TOML 格式。复制到 ~/.config/fileX/filex.conf，
# 或使用 filex --config /完整路径/filex.conf。
# 修改后 TUI 按 ,。
[browser]
show_hidden = false
directories_first = true
sort = "name"          # name / size（大→小）/ modified（新→旧）
max_entries = 1000     # 每个目录普通显示上限，搜索定位的路径仍可显示
max_expand_nodes = 5000 # E 自动展开时最多访问的节点数
max_loaded_nodes = 6000 # Rust TUI 缓存上限；增大此值会增加内存使用

[layout]
dual_pane = false # v 开关双栏；右栏镜像，Tab 切换
highlight_path = true # 祖先路径高亮，其余分支稍暗
column_gap = 6         # 3..20，横向列间距（字符格）
max_label_width = 32   # 12..120，完整路径仍显示于状态栏
row_spacing = 1       # 1..4

[dashboard]
dashboard_width = 36  # 20..240 列；[ / ] 每次缩窄 / 加宽 4 列；树至少保留 36 列

[search]
search_max_results = 500
search_scan_limit = 100000 # 递归搜索的条目扫描上限；不会跟随符号链接

[preview]
preview_lines = 5     # q / I 预览文件开头行数，0 关闭；0..1000，同时受 preview_bytes 限制
preview_bytes = 65536  # 1024..1048576，仅 UTF-8 文本预览

# TUI 节点 / 连接线颜色使用终端 RGB；旧背景项兼容保留。
[colors]
path_color = "#9cc5d1" # 当前光标的祖先路径连接线
background = "#111820"
foreground = "#d9e3ee"
folder_color = "#7dcfff"
file_color = "#c8d3df"
selected_color = "#304962"
line_color = "#526779"
link_color = "#4B0082" # 软链接的 ------目标：靛蓝色、加粗

# 目录名精确匹配（区分大小写）；未匹配时用 colors.folder_color。
[folder_colors]
".git" = "#c678dd" # 隐藏目录也可按名称配色
node_modules = "#98c379"
__pycache__ = "#e5c07b"
pycache = "#e5c07b"

# 扩展名颜色。最长后缀优先，不区分大小写。
# 可添加 ".tar.gz"；"*" = 其他文件；"" = 无扩展名。
[extension_colors]
".mjs" = "#FFD700"
".py" = "#e5c07b"
".html" = "#e06c75"
".js" = "#FFD700"
".png" = "#c792ea"
".jpg" = "#c792ea"
".md" = "#98c379"
".r" = "#61afef"
".cpp" = "#56b6c2"
".sh" = "#98c379"
".mp3" = "#c792ea"
".mp4" = "#e06c75"

# 打开程序使用参数列表，不经过 shell。{path}=绝对路径，{filex}=本项目，{toolkit}=相邻 toolkit。
# terminal=true：TUI 优先使用 tmux 右侧空闲 pane，否则当前终端。
[openers.system]
label = "系统默认"
command = ["xdg-open", "{path}"]
terminal = false

[openers.vscodium]
label = "VSCodium"
command = ["codium", "--", "{path}"]
terminal = false

[openers.vim]
label = "Vim"
command = ["vim", "--", "{path}"]
terminal = true

[openers.nvim]
label = "Neovim"
command = ["nvim", "--", "{path}"]
terminal = true

[openers.nano]
label = "Nano"
command = ["nano", "--", "{path}"]
terminal = true

[openers.firefox]
label = "Firefox"
command = ["firefox", "{path}"]
terminal = false

# Enter 选择 Python 执行，或将 open_defaults 的 .py 改为 python。
# 终端程序在文件所在目录运行；脚本输出结束后返回 TUI。
[openers.python]
label = "Python 执行"
command = ["python", "{path}"]
terminal = true
pause_on_exit = true # TUI 当前终端按 Enter 返回；tmux pane 留下输出

# 自动复制 Markdown 路径，再使用相邻 toolkit 的渲染器在 Firefox 打开。
# 可把 {toolkit} 改为其他 toolkit 的完整路径；不占用既有 4177 端口。
[openers.rscript]
label = "Rscript 执行"
command = ["Rscript", "{path}"]
terminal = true
pause_on_exit = true

[openers.bash]
label = "Bash 执行"
command = ["bash", "--", "{path}"]
terminal = true
pause_on_exit = true

[openers.markdown]
label = "Toolkit Markdown / Firefox"
command = ["node", "{filex}/scripts/open_markdown.mjs", "--toolkit", "{toolkit}", "--browser", "firefox", "--", "{path}"]
terminal = false
copy_path = true

# Enter 显示选择菜单并优先列出默认程序；o 直接使用默认程序。
[open_defaults]
# 可添加 ".r" = "rscript" / ".sh" = "bash"；Enter 菜单也可选择运行。
".md" = "markdown"
".markdown" = "markdown"
".py" = "vscodium"
".html" = "firefox"
".htm" = "firefox"
"*" = "system"
"<directory>" = "system"

# 可使用单字符、Ctrl+字母、Ctrl+Shift+字母或 Ctrl+Alt+字母；不可重复。
# Arrow / Enter / Space / Esc / H / L / Ctrl+C / Ctrl+U 保留；parent 可用 Left。
# Ctrl+F 和 / 总是可用于搜索；Shift+R 重命名，F5 / Ctrl+F5 刷新，Ctrl+Alt+C 复制路径。
[keys]
toggle_dual = "v"
switch_pane = "Tab"
quit = "Q"
exit_here = "x" # 退出并将启动 terminal 切到选中目录；需要 filex shell function
dashboard = "q"
dashboard_narrow = "[" # 缩窄信息面板，运行时调整不写入配置
dashboard_widen = "]"  # 加宽信息面板
link_info = "I" # 完整文件 / 链接信息，TUI 可滚动
up = "k"
down = "j"
expand = "l"
collapse = "h"
expand_all = "E"
collapse_all = "C"
open = "o"
open_with = "w"
preview = "p"
hidden = "."
refresh = "Ctrl+r"
search = "Ctrl+f"
next_match = "n"
previous_match = "N"
goto = "g"
parent = "Left" # ← 返回父级；根节点时引入上级目录
focus_root = "f"
new_file = "a" # Ctrl+N 同样新建文件
new_folder = "A" # Ctrl+Shift+N 同样新建目录
rename = "r" # Shift+R 也可重命名
copy = "c"
copy_path = "Ctrl+Alt+c"
move = "m"
trash = "D"
help = "?"
config = ","

[tmux]
open_in_right_pane = true # 终端程序优先复用右侧空闲 pane；否则当前终端

[input_method]
auto_english = true # TUI 启动时切到 Fcitx5 keyboard-us，正常退出 / 错误返回时恢复原输入法

[links]
scan_limit = 10000 # q / I 按需查找硬链接其他路径，仅当前根目录内，不跟随软链接
max_results = 32  # 包含隐藏路径；达到扫描 / 结果上限会提示

[terminal]
konsole_shortcuts = true # Rust TUI 临时释放所在 Konsole 窗口的 Ctrl+Shift+N；退出恢复
# 多个 filex 共用同一窗口 / tmux server 时，最后一个退出才恢复。
tmux_extended_keys = true # 临时使用 tmux 增强键 + CSI-u；不改写 tmux 配置文件
