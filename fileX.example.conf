# 打开程序使用参数列表，不经过 shell。{path}=绝对路径，{filex}=本项目，{toolkit}=相邻 toolkit。
# terminal=true：TUI 优先使用 tmux 右侧空闲 pane，否则当前终端。
[openers.system]
label = "系统默认"
command = ["xdg-open", "{path}"]
terminal = false

[openers.vscodium]
label = "VSCodium"
command = ["codium", "--", "{path}"]
terminal = false

[openers.vim]
label = "Vim"
command = ["vim", "--", "{path}"]
terminal = true

[openers.nvim]
label = "Neovim"
command = ["nvim", "--", "{path}"]
terminal = true

[openers.nano]
label = "Nano"
command = ["nano", "--", "{path}"]
terminal = true

[openers.firefox]
label = "Firefox"
command = ["firefox", "{path}"]
terminal = false

# Enter 选择 Python 执行，或将 open_defaults 的 .py 改为 python。
# 终端程序在文件所在目录运行；脚本输出结束后返回 TUI。
[openers.python]
extensions = [".py", ".pyw"]
label = "Python 执行"
command = ["python", "{path}"]
terminal = true
pause_on_exit = true # TUI 当前终端按 Enter 返回；tmux pane 留下输出

# 自动复制 Markdown 路径，再使用相邻 toolkit 的渲染器在 Firefox 打开。
# 可把 {toolkit} 改为其他 toolkit 的完整路径；不占用既有 4177 端口。
[openers.rscript]
extensions = [".r"]
label = "Rscript 执行"
command = ["Rscript", "{path}"]
terminal = true
pause_on_exit = true

[openers.bash]
extensions = [".sh", ".bash"]
label = "Bash 执行"
command = ["bash", "--", "{path}"]
terminal = true
pause_on_exit = true

[openers.markdown]
extensions = [".md", ".markdown"]
label = "Toolkit Markdown / Firefox"
command = ["node", "{filex}/scripts/open_markdown.mjs", "--toolkit", "{toolkit}", "--browser", "firefox", "--", "{path}"]
terminal = false
copy_path = true

# Enter 显示选择菜单并优先列出默认程序；o 直接使用默认程序。
[openers.unzip]
extensions = [".zip"]
label = "Bash unzip / 解压 ZIP"
command = ["bash", "--", "{filex}/scripts/unzip.sh", "{path}"]
terminal = true
pause_on_exit = true

[open_defaults]
".zip" = "unzip"
# 可添加 ".r" = "rscript" / ".sh" = "bash"；Enter 菜单也可选择运行。
".md" = "markdown"
".markdown" = "markdown"
".py" = "vscodium"
".html" = "firefox"
".htm" = "firefox"
"*" = "system"
"<directory>" = "system"

# 可使用单字符、Ctrl+字母、Ctrl+Shift+字母或 Ctrl+Alt+字母；不可重复。
# Arrow / Enter / Space / Esc / H / L / Ctrl+C / Ctrl+U 保留；parent 可用 Left。
# Ctrl+F 和 / 总是可用于搜索；Shift+R 重命名，F5 / Ctrl+F5 刷新，Ctrl+Alt+C 复制路径。
[keys]
toggle_dual = "v"
switch_pane = "Tab"
quit = "Q"
exit_here = "x" # 退出并将启动 terminal 切到选中目录；需要 filex shell function
dashboard = "q"
dashboard_narrow = "[" # 缩窄信息面板，运行时调整不写入配置
dashboard_widen = "]"  # 加宽信息面板
link_info = "I" # 完整文件 / 链接信息，TUI 可滚动
up = "k"
down = "j"
expand = "l"
collapse = "h"
expand_all = "E"
collapse_all = "C"
open = "o"
open_with = "w"
preview = "p"
hidden = "."
refresh = "Ctrl+r"
search = "Ctrl+f"
next_match = "n"
previous_match = "N"
goto = "g"
parent = "Left" # ← 返回父级；根节点时引入上级目录
focus_root = "f"
new_file = "a" # Ctrl+N 同样新建文件
new_folder = "A" # Ctrl+Shift+N 同样新建目录
rename = "r" # Shift+R 也可重命名
copy = "c"
copy_path = "Ctrl+Alt+c"
move = "m"
trash = "D"
run_background = "!" # 选中文件夹，输入命令后在该目录后台执行
help = "?"
config = ","

[tmux]
open_in_right_pane = true # 终端程序优先复用右侧空闲 pane；否则当前终端

[input_method]
auto_english = true # TUI 启动时切到 Fcitx5 keyboard-us，正常退出 / 错误返回时恢复原输入法

[links]
scan_limit = 10000 # q / I 按需查找硬链接其他路径，仅当前根目录内，不跟随软链接
max_results = 32  # 包含隐藏路径；达到扫描 / 结果上限会提示

[terminal]
mode = "auto" # auto 自动检测 Linux TTY / SSH；tty 强制兼容模式（也可 filex --tty）
color_mode = "consistent" # consistent 共用 Linux 16 色；auto / 16 / 256 / truecolor / none；NO_COLOR 优先
charset = "auto" # auto：Linux TTY / 无桌面用 ASCII 线条与英文控制提示；ascii / unicode 可覆盖
cli_opener = "auto" # 无桌面时默认 nano → nvim → vim → 内置预览；或配置 terminal=true 的 opener 名
konsole_shortcuts = true # Rust TUI 临时释放所在 Konsole 窗口的 Ctrl+Shift+N；退出恢复
# 多个 filex 共用同一窗口 / tmux server 时，最后一个退出才恢复。
tmux_extended_keys = true # 临时使用 tmux 增强键 + CSI-u；不改写 tmux 配置文件

# 排序：先 top（按列表顺序），再普通项（沿用 directories_first/sort），最后 bottom。
[order]
top = [] # 例如 ["index.html", "README.md"]
bottom = [] # 例如 ["node_modules", "__pycache__"]

# 指定目录：绝对路径、~/路径，或同名目录。未写的字段继承全局，[] 清空继承。
# [directory_order."~/Documents/site"]
# top = ["index.html"]
# bottom = ["<other-folders>", "node_modules"]
# <other-folders> 匹配未在 top/bottom 中显式点名的所有子目录（不含目录软链接）。
# 可放在 top 或 bottom；显式名称优先，匹配到的目录沿用 sort 排序。

# [directory_order."/home/a/Documents/someProducts/Visualize-sheet"]
# top = ["launch.sh", "index.html"]

[git]
enabled = true
max_entries = 4000 # 每个仓库的状态映射上限（包括父目录），最多缓存 4 个仓库；F5 更新
