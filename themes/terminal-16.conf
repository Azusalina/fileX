# Shared semantic 16-colour theme. consistent mode maps both terminals to the same slots.
[colors]
folder_color = "#55FFFF"
file_color = "#AAAAAA"
line_color = "#555555"
path_color = "#55FFFF"
link_color = "#4B0082"

[folder_colors]
".git" = "#55FFFF"
".github" = "#55FFFF"
node_modules = "#555555"
__pycache__ = "#555555"
pycache = "#555555"

[extension_colors]

# code
".py" = "#FFD700"
".pyi" = "#FFD700"
".r" = "#FFD700"
