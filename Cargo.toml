[package]
name = "filex"
version = "1.5.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight horizontal-tree file explorer for Linux"

[dependencies]
crossterm = "0.29"
toml = "0.9"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
