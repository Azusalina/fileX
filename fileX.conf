# fileX v1.3 — TOML 格式。复制到 ~/.config/fileX/fileX.conf，
# 或使用 filex --config /完整路径/fileX.conf。
# 修改后 TUI 按 , / GUI 点「读取配置」。
[browser]
show_hidden = false
directories_first = true
sort = "name"          # name / size（大→小）/ modified（新→旧）
max_entries = 1000     # 每个目录普通显示上限，搜索定位的路径仍可显示
max_expand_nodes = 5000 # E 自动展开时最多访问的节点数
max_loaded_nodes = 6000 # Rust TUI 缓存上限；增大此值会增加内存使用

[layout]
orientation = "horizontal" # horizontal / vertical；v 临时切换
column_gap = 6         # 3..20，横向列 / 纵向同级节点间距（字符格）
max_label_width = 32   # 12..120，完整路径仍显示于状态栏
row_spacing = 1       # 1..4

[dashboard]
dashboard_width = 36  # TUI 右侧信息面板宽度；终端至少需要 70 列

[search]
search_max_results = 500
search_scan_limit = 100000 # 递归搜索的条目扫描上限；不会跟随符号链接

[preview]
preview_bytes = 65536  # 1024..1048576，仅 UTF-8 文本预览

[gui]
gui_font_size = 11     # 8..32

# GUI 界面主题；TUI 的节点 / 连接线颜色近似映射到终端调色板。
[colors]
background = "#111820"
foreground = "#d9e3ee"
folder_color = "#7dcfff"
file_color = "#c8d3df"
selected_color = "#304962"
line_color = "#526779"

# 两种界面的扩展名颜色。最长后缀优先，不区分大小写。
# 可添加 ".tar.gz"；"*" = 其他文件；"" = 无扩展名。
[extension_colors]
".py" = "#e5c07b"
".html" = "#e06c75"
".png" = "#c792ea"
".jpg" = "#c792ea"
".md" = "#98c379"

# 打开程序使用参数列表，不经过 shell。{path} 替换为完整路径。
# terminal=true：TUI 优先使用 tmux 右侧空闲 pane，否则当前终端；GUI 使用 Konsole。
[openers.system]
label = "系统默认"
command = ["xdg-open", "{path}"]
terminal = false

[openers.vscodium]
label = "VSCodium"
command = ["codium", "--", "{path}"]
terminal = false

[openers.vim]
label = "Vim"
command = ["vim", "--", "{path}"]
terminal = true

[openers.nvim]
label = "Neovim"
command = ["nvim", "--", "{path}"]
terminal = true

[openers.nano]
label = "Nano"
command = ["nano", "--", "{path}"]
terminal = true

[openers.firefox]
label = "Firefox"
command = ["firefox", "{path}"]
terminal = false

# Enter 显示选择菜单并优先列出默认程序；o 直接使用默认程序。
[open_defaults]
".py" = "vscodium"
".html" = "firefox"
".htm" = "firefox"
"*" = "system"
"<directory>" = "system"

# 可使用单字符或 Ctrl+字母；不可重复。
# Arrow / Enter / Space / Esc / H / L / Ctrl+C / Ctrl+U 保留；parent 可用 Left。
# Ctrl+F 和 / 总是可用于搜索。
[keys]
quit = "Q"
dashboard = "q"
up = "k"
down = "j"
expand = "l"
collapse = "h"
expand_all = "E"
collapse_all = "C"
open = "o"
open_with = "w"
preview = "p"
hidden = "."
refresh = "r"
search = "Ctrl+f"
next_match = "n"
previous_match = "N"
goto = "g"
parent = "Left" # 横向 ← / 纵向 ↑；方向键随布局旋转
toggle_tree = "v"
focus_root = "f"
new_file = "a"
new_folder = "A"
rename = "R"
copy = "c"
move = "m"
trash = "D"
help = "?"
config = ","

[tmux]
open_in_right_pane = true # 终端程序优先复用右侧空闲 pane；否则当前终端
