# fileX v1.4 — TOML 格式。复制到 ~/.config/fileX/fileX.conf，
# 或使用 filex --config /完整路径/fileX.conf。
# 修改后 TUI 按 , / GUI 点「读取配置」。
[browser]
show_hidden = false
directories_first = true
sort = "name"          # name / size（大→小）/ modified（新→旧）
max_entries = 1000     # 每个目录普通显示上限，搜索定位的路径仍可显示
max_expand_nodes = 5000 # E 自动展开时最多访问的节点数
max_loaded_nodes = 6000 # Rust TUI 缓存上限；增大此值会增加内存使用

[layout]
column_gap = 6         # 3..20，横向列间距（字符格）
max_label_width = 32   # 12..120，完整路径仍显示于状态栏
row_spacing = 1       # 1..4

[dashboard]
dashboard_width = 36  # TUI 右侧信息面板宽度；终端至少需要 70 列

[search]
search_max_results = 500
search_scan_limit = 100000 # 递归搜索的条目扫描上限；不会跟随符号链接

[preview]
preview_bytes = 65536  # 1024..1048576，仅 UTF-8 文本预览

[gui]
gui_font_size = 11     # 8..32

# GUI 界面主题；TUI 的节点 / 连接线颜色近似映射到终端调色板。
[colors]
background = "#111820"
foreground = "#d9e3ee"
folder_color = "#7dcfff"
file_color = "#c8d3df"
selected_color = "#304962"
line_color = "#526779"

# 两种界面的扩展名颜色。最长后缀优先，不区分大小写。
# 可添加 ".tar.gz"；"*" = 其他文件；"" = 无扩展名。
[extension_colors]
".py" = "#e5c07b"
".html" = "#e06c75"
".png" = "#c792ea"
".jpg" = "#c792ea"
".md" = "#98c379"
".r" = "#61afef"
".cpp" = "#56b6c2"
".sh" = "#98c379"
".mp3" = "#c792ea"
".mp4" = "#e06c75"

# 打开程序使用参数列表，不经过 shell。{path}=绝对路径，{filex}=本项目，{toolkit}=相邻 toolkit。
# terminal=true：TUI 优先使用 tmux 右侧空闲 pane，否则当前终端；GUI 使用 Konsole。
[openers.system]
label = "系统默认"
command = ["xdg-open", "{path}"]
terminal = false

[openers.vscodium]
label = "VSCodium"
command = ["codium", "--", "{path}"]
terminal = false

[openers.vim]
label = "Vim"
command = ["vim", "--", "{path}"]
terminal = true

[openers.nvim]
label = "Neovim"
command = ["nvim", "--", "{path}"]
terminal = true

[openers.nano]
label = "Nano"
command = ["nano", "--", "{path}"]
terminal = true

[openers.firefox]
label = "Firefox"
command = ["firefox", "{path}"]
terminal = false

# Enter 选择 Python 执行，或将 open_defaults 的 .py 改为 python。
# 终端程序在文件所在目录运行；脚本输出结束后返回 TUI。
[openers.python]
label = "Python 执行"
command = ["python", "{path}"]
terminal = true
pause_on_exit = true # TUI 当前终端按 Enter 返回；GUI Konsole 保留输出，tmux pane 留下输出

# 自动复制 Markdown 路径，再使用相邻 toolkit 的渲染器在 Firefox 打开。
# 可把 {toolkit} 改为其他 toolkit 的完整路径；不占用既有 4177 端口。
[openers.markdown]
label = "Toolkit Markdown / Firefox"
command = ["node", "{filex}/scripts/open_markdown.mjs", "--toolkit", "{toolkit}", "--browser", "firefox", "--", "{path}"]
terminal = false
copy_path = true

# Enter 显示选择菜单并优先列出默认程序；o 直接使用默认程序。
[open_defaults]
".md" = "markdown"
".markdown" = "markdown"
".py" = "vscodium"
".html" = "firefox"
".htm" = "firefox"
"*" = "system"
"<directory>" = "system"

# 可使用单字符、Ctrl+字母或 Ctrl+Alt+字母；不可重复。
# Arrow / Enter / Space / Esc / H / L / Ctrl+C / Ctrl+U 保留；parent 可用 Left。
# Ctrl+F 和 / 总是可用于搜索；Shift+R 重命名，F5 刷新，Ctrl+Alt+C 复制路径。
[keys]
quit = "Q"
dashboard = "q"
up = "k"
down = "j"
expand = "l"
collapse = "h"
expand_all = "E"
collapse_all = "C"
open = "o"
open_with = "w"
preview = "p"
hidden = "."
refresh = "Ctrl+r"
search = "Ctrl+f"
next_match = "n"
previous_match = "N"
goto = "g"
parent = "Left" # ← 返回父级；根节点时引入上级目录
focus_root = "f"
new_file = "a"
new_folder = "A"
rename = "r" # Shift+R 也可重命名
copy = "c"
copy_path = "Ctrl+Alt+c"
move = "m"
trash = "D"
help = "?"
config = ","

[tmux]
open_in_right_pane = true # 终端程序优先复用右侧空闲 pane；否则当前终端

[input_method]
auto_english = true # TUI 启动时切到 Fcitx5 keyboard-us，正常退出 / 错误返回时恢复原输入法
